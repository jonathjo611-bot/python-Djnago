{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Spotify{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'home' %}">
            <img src="{% static 'images/logo.png' %}" alt="App Logo">
            <span>Spotify</span>
        </a>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'playlist-detail' %}">Playlists</a>
        <a href="{% url 'artist-detail' %}">Artists</a>
        <a href="{% url 'podcast-detail' %}">Podcasts</a>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
